name: Storybook CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-storybook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
      - name: Install (regenerate lockfile if needed)
        run: |
          npm install --legacy-peer-deps
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package-lock.json || true
          git commit -m "chore: update package-lock.json (storybook CI)" || echo "no lockfile changes"
          git push || echo "no push"
      - run: npx storybook build -s public -o storybook-static
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: storybook-static
