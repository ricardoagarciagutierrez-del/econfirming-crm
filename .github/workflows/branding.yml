name: Branding Automation

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  apply-branding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install
        run: npm ci
      - name: Apply branding (generate tokens/css)
        run: npm run apply:branding
      - name: Commit branding changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/design && git add src/index.css || true
          git commit -m "chore: apply automated branding tokens" || echo "No changes to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
